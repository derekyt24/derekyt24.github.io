<head>
    <title>Not found &#8211; DerekYT</title>
    <link rel="icon" type="image/png" href="/assets/20260831-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-size:cover;
            background-repeat:no-repeat;
            font-family:"Inter", sans-serif;
            font-weight:400;
            color:#ffffff;
            text-align:left;
            max-width:750px;
            margin:0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding:25px 20px 25px 20px;
        }

        @media (max-width:600px) and (prefers-color-scheme: light) {
            body {
                background-color:#ffffff;
                color: #0a1015;
            }

            a:link,
            a:hover,
            a:visited {
                color: #0a1015;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color:#ffffff;
                color: #0a1015;
            }
        }

        @media (max-width:600px) and (prefers-color-scheme: dark) {
            body {
                background-color:#0a1015;
                color: #ffffff;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color:#0a1015;
                color: #ffffff;
            }
        }
        
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-links {
            display: flex;
            gap:15px;
        }

        .nav-links a {
            opacity: 0.5;
            text-decoration:none;
        }

        .nav-links a:link {
            opacity:0.5;
        }

        .nav-links a:hover {
            opacity:0.75;
        }

        .nav-links a:visited {
            opacity:0.5;
        }
        
        .nav-brand {
            font-weight:500;
            margin-right:15px;
        }    

        .heading-div-height {
            line-height:1%;
        }    
        
        .page-not-found-font {
            font-size:56px;
            font-weight:600;
        }
        
        .heading-body-line-height {
            line-height:25px;
        }

        .ver-head-font {
            letter-spacing:0.25px;
            font-weight:550;
        }

        img {
            border-radius: 7px;
        }

        a:link {
            opacity:1;
        }

        a:hover {
            opacity:0.75;
        }

        a:visited {
            color:#ffffff;
            opacity:0.5;
        }

        .break-height {
            line-height:100%;
        }

        footer {
            font-size:10px;
            letter-spacing:0.25px;
            opacity:0.5;
            margin-top: auto;
        }
    </style>
</head>
</style>
<body>
    <header>
    {% include site-header.html %}
<div class="heading-div-height">
        <p class="page-not-found-font">404</p>
        <p class="heading-body-line-height">Uh oh. That page couldn't be found.</p>
        <p class="heading-body-line-height">The page you were looking for may have moved or is missing. Double check your URL.</p>
    </div>
    </header>
{% include site-footer.html %}
</body>
