        <p class="welcome-font">What's new in Apple beta timelines version 1.0 beta 2</p>
        <div class="changes-section">
            <p class="changes-class">Fixed a naming issue with GM and final builds of iOS 11.0.</p>
        </div>
        <p class="update-metadata" data-utc="2025-11-24T20:27Z">November 24, 2025 • 20:27 UTC</p>

    </div>
    <br>
{% include site-footer.html %}
<script>
    document.querySelectorAll('[data-utc]').forEach(el => {
    const date = new Date(el.dataset.utc);
    el.textContent = "" + date.toLocaleString(undefined, {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
        timeZoneName: 'short'
    });
});
</script>
</body>
