---
---
<head>
    <title>Apple beta timelines version 1.5 beta 4 &#8211; DerekYT</title>
    <link rel="icon" type="image/png" href="/assets/20260831-favicon.png">
    <link rel="stylesheet" href="/assets/style-sheets/apple-beta-timelines-releases.css">
<!-- Font information (start) -->
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="../../assets/fonts/sf-pro.css">
<!-- Font information (end) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="preload" as="image" href="https://derekyt.dev/assets/bg-images/apple-beta-timelines/15D01.png">
    <style>
        button, input, select, textarea {
            font-family: inherit;
        }

        body {
            background-image:url('https://derekyt.dev/assets/bg-images/apple-beta-timelines/15D01.png');
            background-attachment: fixed;
            background-size:cover;
            font-family: "SF Pro", "Inter", sans-serif;
            text-align:left;
            max-width:750px;
            margin:0 auto;
            padding-top:30px;
            padding-bottom:30px;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        b {
            font-weight:500;
        }

        :root {
            font-family: "SF Pro", Inter, sans-serif;
            font-feature-settings: 'liga' 1, 'calt' 1; /* fix for Chrome */
        }
        @supports (font-variation-settings: normal) {
            :root { font-family: "SF Pro", InterVariable, sans-serif; }
        }


        nav {
            display: flex;
            justify-content:space-between;
        }

        @media (prefers-color-scheme: light) {
            body {
                color: #ffffff;
            }    
        
            a:link, a:visited {
                color: #ffffff;
            }

            .nav-links a {
                color: #ffffff;
            }
            .nav-brand {
                color: #ffffff;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0c0e11;
                color: #ffffff;
            }
            a:link, a:visited {
                color: #ffffff;
            }
            .nav-links a {
                color: #ffffff;
            }
            .nav-brand {
                color: #ffffff;
            }
        }
        
        @media (max-width:600px) {
            body {
                padding-left:15px;
                padding-right:15px;
            }
            nav {
                font-size:14px;
            }
        }

        .nav-links {
            display: flex;
            gap:15px;
        }

        .nav-links a {
            opacity:0.5;
            text-decoration:none;
        }

        .nav-links a:link {
            opacity:0.5;
        }

        .nav-links a:hover {
            opacity:0.75;
        }

        .nav-links a:visited {
            opacity:0.5;
        }
        
        .nav-brand {
            font-weight:500;
            margin-right:15px;
        }
        
.welcome-font {
            max-width:90%;
            margin-top:25px;
            margin-bottom:15px;
            font-size:36px;
            font-weight:500;
            line-height:1.3;
            letter-spacing:-0.5px;
        }

        img {
            border-radius: 7px;
            width: 150px;
            height: 150px;
        }

        hr {
            width:100%;
        }

        .update-metadata {
            margin-top:5px;
            margin-bottom:5px;
            font-size:12px;
            opacity:0.5;
            letter-spacing:0.25px;
        }

        a:link {
            opacity:0.83;
        }

        a:hover {
            opacity:0.67;
        }

        a:visited {
            opacity:0.5;
        }

        .heading-body-line-height {
            line-height:1.5;
            margin-top:10px;
            margin-bottom:10px;
        }

        .special-timeline-height {
            line-height:1;
        }

        footer {
            font-size:10px;
            letter-spacing:0.25px;
            opacity:0.5;
            margin-top: auto;
        }
    </style>
</head>
</style>
<body>
    <header>
    {% include site-header.html %}
</header>
    <div>
        <h1 class="welcome-font">What's new in Apple beta timelines version 1.5 beta 4</h1>
        <p class="heading-body-line-height">Added watchOS 10.0-10.6 and 11.0-11.6 timelines.</p>
        <p class="update-metadata" data-utc="2026-03-01T02:17Z">March 1, 2026 • 02:17 UTC</p>
        <p class="update-metadata">Build number: 15D01</p>
    </div>
    <br>
{% include site-footer.html %}
<script>
    document.querySelectorAll('[data-utc]').forEach(el => {
    const date = new Date(el.dataset.utc);
    el.textContent = "" + date.toLocaleString(undefined, {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
        timeZoneName: 'short'
    });
});
</script>
</body>
