name: Apple beta timelines version 2.0 is here

on:
  schedule:
    - cron: "0 19 16 10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Merge the scheduled release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%F)" != "2026-10-16" ]; then
            echo "Not the scheduled publication date."
            exit 0
          fi

          PR_NUMBER="$(gh pr list --base main --head scheduled --state open --json number --jq '.[0].number')"

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR from scheduled to main was found."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --merge